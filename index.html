<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinuk | La Forgia</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a09; /* Nero profondo, quasi catrame materico */
            color: #d1cbb8; /* Bianco osso / pergamena grezza */
            font-family: "Georgia", serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .sigillo {
            padding: 3rem;
            border: 1px solid rgba(209, 203, 184, 0.1); /* Un recinto sottilissimo */
            max-width: 600px;
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            font-weight: normal;
        }
        p {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #7a766a;
            letter-spacing: 1px;
            margin-bottom: 2rem;
        }
        .cuore-quantistico {
            width: 6px;
            height: 6px;
            background-color: #d1cbb8;
            border-radius: 50%;
            margin: 0 auto;
            animation: respiro 4s infinite ease-in-out;
        }
        @keyframes respiro {
            0%, 100% { opacity: 0.1; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.5); box-shadow: 0 0 10px rgba(209,203,184,0.5); }
        }
    </style>
</head>
<body>
    <div class="sigillo">
        <h1>Wunderkammer In Sigillatura</h1>
        <p>Trinuk non è un luogo digitale, è un perimetro fisico.<br>
        Stiamo allineando i magneti, calibrando le geometrie ed evocando le storie.</p>
        <p>Il portale si aprirà solo quando la materia sarà fusa con l'archetipo.</p>
        <div class="cuore-quantistico"></div>
    </div>
</body>
</html>
