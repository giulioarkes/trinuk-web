<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinuk | Anima Story Studio</title>
    <style>
        /* FONDAMENTA E BLOCCO DEL CONTENITORE */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%;
            background-color: #0a0a09; 
            color: #d1cbb8; 
            font-family: "Georgia", serif; 
            overflow-x: hidden; 
        }
        
        /* HEADER NAVBAR */
        .navbar { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            padding: 2rem 4rem; 
            box-sizing: border-box; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 10; 
            border-bottom: 1px solid rgba(209, 203, 184, 0.1); 
        }
        .nav-brand { font-size: 1.2rem; letter-spacing: 4px; color: #d1cbb8; text-decoration: none; text-transform: uppercase; }
        .nav-links a { color: #7a766a; text-decoration: none; font-size: 0.85rem; letter-spacing: 2px; margin-left: 3rem; text-transform: uppercase; transition: color 0.4s ease; }
        .nav-links a:hover, .nav-links a.active { color: #d1cbb8; }

        /* ATTO ZERO: IL PORTALE VIDEO */
        .hero { 
            position: relative; 
            height: 100vh; 
            width: 100vw; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            overflow: hidden; 
            box-sizing: border-box;
        }

        .hero video { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            min-width: 100%; 
            min-height: 100%; 
            width: auto; 
            height: auto; 
            z-index: 0; 
            transform: translateX(-50%) translateY(-50%); 
            object-fit: cover; 
            filter: brightness(0.35) contrast(1.2); 
        }

        .hero-content { 
            position: relative;
            z-index: 1; 
            padding: 2rem; 
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* IL FUOCO DELLA FORGIA PER IL NOME */
        @keyframes respiroMinerale {
            0% { 
                color: #d1cbb8; 
                text-shadow: 0 0 10px rgba(209, 203, 184, 0.1); 
            }
            50% { 
                color: #fffaf0; 
                text-shadow: 0 0 25px rgba(255, 140, 0, 0.4), 0 0 50px rgba(255, 69, 0, 0.2); 
            }
            100% { 
                color: #d1cbb8; 
                text-shadow: 0 0 10px rgba(209, 203, 184, 0.1); 
            }
        }

        .hero h1 { 
            font-size: 4rem; 
            letter-spacing: 12px; 
            margin-bottom: 0.5rem; 
            font-weight: bold; 
            text-transform: uppercase; 
            animation: respiroMinerale 5s infinite alternate ease-in-out;
        }
        .hero h2 { font-size: 1.2rem; letter-spacing: 6px; margin-bottom: 2rem; color: #d1cbb8; font-weight: normal; text-transform: uppercase; }
        .hero p { font-size: 0.95rem; line-height: 1.8; color: #9c9786; max-width: 600px; margin: 0 auto; letter-spacing: 1px; }

        /* MANIFESTO */
        .manifesto { max-width: 700px; margin: 6rem auto; padding: 0 2rem; box-sizing: border-box; }
        .blocco-testo { margin-bottom: 5rem; text-align: center; }
        .blocco-testo h2 { font-size: 1.2rem; letter-spacing: 4px; color: #d1cbb8; margin-bottom: 2rem; text-transform: uppercase; font-weight: normal; border-bottom: 1px solid rgba(209, 203, 184, 0.2); padding-bottom: 1rem; }
        .blocco-testo p { font-size: 1rem; line-height: 1.9; color: #7a766a; margin-bottom: 1.5rem; text-align: justify; text-align-last: center; }
        
        .ritual-list { text-align: left; margin-top: 3rem; }
        .ritual-list .atto { margin-bottom: 3rem; position: relative; padding-left: 20px; border-left: 1px solid #7a766a; }
        .ritual-list .atto-titolo { display: block; color: #d1cbb8; letter-spacing: 2px; margin-bottom: 0.8rem; font-size: 0.95rem; text-transform: uppercase; }
        .ritual-list .atto-testo { font-size: 0.95rem; color: #7a766a; line-height: 1.8; }

        .footer { margin-top: 6rem; padding-bottom: 4rem; text-align: center; border-top: 1px solid rgba(209, 203, 184, 0.1); padding-top: 4rem; }
        .mail-sigillo { display: inline-block; color: #d1cbb8; text-decoration: none; font-size: 0.85rem; letter-spacing: 2px; transition: opacity 0.4s ease; }
        .mail-sigillo:hover { opacity: 0.4; }

        /* MOBILE */
        @media (max-width: 768px) {
            .navbar { flex-direction: column; padding: 1.5rem 1rem; gap: 1.5rem; }
            .nav-links { display: flex; gap: 1.5rem; justify-content: center; width: 100%; }
            .nav-links a { margin-left: 0; font-size: 0.75rem; }
            .hero h1 { font-size: 2.5rem; letter-spacing: 6px; }
            .hero h2 { font-size: 0.85rem; letter-spacing: 3px; margin-bottom: 1.5rem; }
            .hero p { font-size: 0.85rem; padding: 0 1rem; line-height: 1.6; }
        }
    </style>
</head>
<body>

    <!-- HEADER NAVIGAZIONE UNIFICATO -->
    <header class="navbar">
        <a href="index.html" class="nav-brand">TRINUK</a>
        <nav class="nav-links">
            <a href="manifesto.html" class="active">Manifesto</a>
            <a href="rito.html">Rito</a>
            <a href="narrative.html">Narrative</a>
            <a href="corporate.html">Corporate</a>
        </nav>
    </header>

    <!-- PORTALE VIDEO HERO -->
    <section class="hero">
        <video autoplay muted loop playsinline>
            <source src="rituale.mp4" type="video/mp4">
            Il tuo browser non supporta il flusso video.
        </video>
        <div class="hero-content">
            <h1>TRINUK</h1>
            <h2>LA WUNDERKAMMER DELLA PSICHE</h2>
            <p>
                Sculture interattive e artefatti incompleti.<br>
                Un rito da seguire di materia e pensiero guidato dall'intelligenza artificiale, per esplorare il tuo archetipo profondo.
            </p>
        </div>
    </section>

        <!-- FOOTER -->
    <footer class="footer">
        <a href="mailto:giulio@animastory.studio" class="mail-sigillo">giulio@animastory.studio</a>
    </footer>

</body>
</html>
